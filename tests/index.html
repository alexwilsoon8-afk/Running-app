<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>C25K logic tests</title>
  </head>
  <body>
    <pre id="output"></pre>
    <script type="module">
      import {
        GARMIN_ZONE_INFO, ZONE_INFO, calculateGarminZones, calculateZones, cuesBetween, describeIntervals, describeSession, sustainedPeak, formatClock, locate, nextDay, parseHeartRate,
        spokenDuration, spokenSegment, totalSeconds, zoneFor,
      } from "../js/engine.js";

      const logic = await import("../js/checkin-logic.js");
      const lines = [];
      let failures = 0;
      function check(name, actual, expected) {
        const pass = JSON.stringify(actual) === JSON.stringify(expected);
        if (!pass) failures++;
        lines.push(`${pass ? "ok  " : "FAIL"} ${name}${pass ? "" : `: got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`}`);
      }

      const plan = await (await fetch("../plan.json")).json();
      const session = (week, day) => plan.find((e) => e.week === week && e.day === day).segments;

      // Minutes from the NHS plan, warm-up and cool-down included.
      const nhsMinutes = {
        "1.1": 28.5, "1.2": 28.5, "1.3": 28.5,
        "2.1": 29, "2.2": 29, "2.3": 29,
        "3.1": 25, "3.2": 25, "3.3": 25,
        "4.1": 31.5, "4.2": 31.5, "4.3": 31.5,
        "5.1": 31, "5.2": 31, "5.3": 30,
        "6.1": 34, "6.2": 33, "6.3": 35,
        "7.1": 35, "7.2": 35, "7.3": 35,
        "8.1": 38, "8.2": 38, "8.3": 38,
        "9.1": 40, "9.2": 40, "9.3": 40,
      };
      check("plan has 27 runs", plan.length, 27);
      for (const entry of plan) {
        const key = `${entry.week}.${entry.day}`;
        check(`W${entry.week}D${entry.day} total`, totalSeconds(entry.segments) / 60, nhsMinutes[key]);
        check(`W${entry.week}D${entry.day} warm-up and cool-down`,
          [entry.segments[0], entry.segments.at(-1)],
          [{ type: "warmup", seconds: 300 }, { type: "cooldown", seconds: 300 }]);
      }
      const runsIn = (s) => s.filter((x) => x.type === "run").map((x) => x.seconds / 60);
      check("W1 runs", runsIn(session(1, 1)), Array(8).fill(1));
      check("W2 runs", runsIn(session(2, 1)), Array(6).fill(1.5));
      check("W3 runs", runsIn(session(3, 1)), [1.5, 3, 1.5, 3]);
      check("W4 runs", runsIn(session(4, 1)), [3, 5, 3, 5]);
      check("W5D1 runs", runsIn(session(5, 1)), [5, 5, 5]);
      check("W5D2 runs", runsIn(session(5, 2)), [8, 8]);
      check("W5D3 runs", runsIn(session(5, 3)), [20]);
      check("W6D1 runs", runsIn(session(6, 1)), [5, 8, 5]);
      check("W6D2 runs", runsIn(session(6, 2)), [10, 10]);
      check("W6D3 runs", runsIn(session(6, 3)), [25]);
      check("W9 runs", runsIn(session(9, 3)), [30]);

      const s = session(3, 1);
      check("locate start", locate(s, 0).index, 0);
      check("locate boundary moves on", locate(s, 300).index, 1);
      check("locate just before boundary", locate(s, 299.9).index, 0);
      check("locate past the end", locate(s, 99999), null);

      check("warning fires once at 10 s", cuesBetween(s, 289.9, 290.1).map((c) => c.kind), ["warning"]);
      check("change fires at boundary", cuesBetween(s, 299.9, 300.1).map((c) => c.kind), ["change"]);
      check("no cue mid-segment", cuesBetween(s, 100, 101), []);
      check("final change has no next", cuesBetween(s, totalSeconds(s) - 0.1, totalSeconds(s) + 0.1)[0].next, null);

      check("W1 steps", describeIntervals(session(1, 1)), "Repeat 7 times: run 1 min, walk 1.5 min, then run 1 min");
      check("W2 steps", describeIntervals(session(2, 1)), "Repeat 5 times: run 1.5 min, walk 2 min, then run 1.5 min");
      check("W3 steps", describeIntervals(session(3, 1)), "Run 1.5 min, walk 1.5 min, run 3 min, walk 3 min, run 1.5 min, walk 1.5 min, run 3 min");
      check("W5D1 steps", describeIntervals(session(5, 1)), "Repeat 2 times: run 5 min, walk 3 min, then run 5 min");
      check("W5D2 steps", describeIntervals(session(5, 2)), "Run 8 min, walk 5 min, run 8 min");
      check("W9 steps", describeIntervals(session(9, 1)), "Run 30 min");

      check("next day", nextDay(1, 1), { week: 1, day: 2 });
      check("next week", nextDay(1, 3), { week: 2, day: 1 });
      check("end of plan", nextDay(9, 3), null);

      const zones = [100, 120, 140, 160, 180];
      check("zone below 1", zoneFor(99, zones), 0);
      check("zone 1 starts", zoneFor(100, zones), 1);
      check("zone 3", zoneFor(150, zones), 3);
      check("zone 5 and above", zoneFor(200, zones), 5);
      check("no zones", zoneFor(150, null), null);
      check("no bpm", zoneFor(null, zones), null);

      check("five named zones", ZONE_INFO.filter((z) => z.name && z.purpose).length, 5);
      check("five Garmin zones", GARMIN_ZONE_INFO.filter((z) => z.name && z.purpose).length, 5);
      check("Garmin zones from max HR", calculateGarminZones(190), [95, 114, 133, 152, 171]);
      check("Garmin zones need max HR", calculateGarminZones(null), null);
      check("peak needs five readings", sustainedPeak([190, 190, 190, 190], 150), 150);
      check("peak ignores a spike", sustainedPeak([150, 151, 220, 152, 150], 140), 150);
      check("peak is the level held", sustainedPeak([185, 188, 186, 187, 190], 150), 185);
      check("peak never falls", sustainedPeak([120, 120, 120, 120, 120], 150), 150);
      // Worked example from the evidence document: age 35, resting 60.
      check("zones from age and resting HR", calculateZones({ age: 35, restingHr: 60 }), [60, 110, 134, 153, 172]);
      check("measured max beats age", calculateZones({ age: 35, maxHr: 190, restingHr: 60 }), [60, 112, 138, 158, 177]);
      check("max HR alone isn't enough", calculateZones({ maxHr: 190 }), null);
      check("resting HR alone isn't enough", calculateZones({ restingHr: 60 }), null);
      check("no details", calculateZones({}), null);
      check("resting not below max", calculateZones({ maxHr: 100, restingHr: 100 }), null);

      check("clock", formatClock(90), "1:30");
      check("clock rounds up", formatClock(89.2), "1:30");
      check("clock never negative", formatClock(-1), "0:00");
      check("spoken 60", spokenDuration(60), "1 minute");
      check("spoken 90", spokenDuration(90), "90 seconds");
      check("spoken 150", spokenDuration(150), "2 and a half minutes");
      check("spoken 1200", spokenDuration(1200), "20 minutes");
      check("spoken segment", spokenSegment({ type: "run", seconds: 90 }), "Run for 90 seconds");
      check("session text", describeSession(session(1, 1)), "8 runs, 8 min running, 28.5 min total");

      check("HR uint8", parseHeartRate(new DataView(new Uint8Array([0x00, 150]).buffer)), 150);
      check("HR uint16", parseHeartRate(new DataView(new Uint8Array([0x01, 0x2c, 0x01]).buffer)), 300);
      check("HR with RR data", parseHeartRate(new DataView(new Uint8Array([0x10, 72, 0x20, 0x03]).buffer)), 72);

      // Weekly check-in
      const day = 86400000;
      const at = (days) => new Date(Date.UTC(2026, 0, 1) + days * day).toISOString();
      const fullRun = (d, week, dayNo) => ({
        runnerId: "a", week, day: dayNo, completed: true, date: at(d), duration: totalSeconds(session(week, dayNo)),
      });
      const week1 = [fullRun(0, 1, 1), fullRun(2, 1, 2), fullRun(4, 1, 3)];
      const profile = { id: "a", week: 2, day: 1, planComplete: false };
      const checkinAt = (d, confidence, extra = {}) => ({
        id: `c${d}`, runnerId: "a", planWeek: 1, date: at(d), wins: [],
        answers: { energy: 2, runFeel: 2, sleep: 2, confidence }, ...extra,
      });

      check("completed runs, full session", logic.completedRuns(plan, week1[0]).length, 8);
      check("completed runs stop at the end point", logic.completedRuns(plan, { ...week1[0], duration: 420 }), [60]);
      check("partial run doesn't count", logic.completedRuns(plan, { ...week1[0], duration: 330 }), []);
      check("ended early", logic.endedEarly(plan, { ...week1[0], duration: 420 }), true);
      check("finished isn't early", logic.endedEarly(plan, week1[0]), false);
      check("personal best", logic.personalBestMinutes(plan, week1), 1);
      check("best never falls", logic.personalBestMinutes(plan, [fullRun(1, 3, 1), { ...fullRun(2, 1, 1) }]), 3);
      check("running minutes", logic.runningMinutes(plan, week1), 24);
      check("sessions are unique", logic.sessionsDone([...week1, week1[0]]), 3);
      check("next longest, week 1", logic.nextLongestMinutes(plan, 1), 1.5);
      check("next longest, week 4", logic.nextLongestMinutes(plan, 4), 20);
      check("next longest, week 9", logic.nextLongestMinutes(plan, 9), 30);

      check("not due before any run", logic.checkinDue(profile, [], [], Date.parse(at(1))), false);
      check("not due after 2 runs", logic.checkinDue(profile, week1.slice(0, 2), [], Date.parse(at(3))), false);
      check("due after 3 runs", logic.checkinDue(profile, week1, [], Date.parse(at(4))), true);
      check("due after 7 days", logic.checkinDue(profile, week1.slice(0, 1), [], Date.parse(at(7))), true);
      const done = checkinAt(5, 3);
      check("not due straight after one", logic.checkinDue(profile, week1, [done], Date.parse(at(6))), false);
      check("due 7 days after the last", logic.checkinDue(profile, week1, [done], Date.parse(at(12))), true);
      const skip1 = logic.nextSkip(profile, week1, [], Date.parse(at(4)));
      check("skipped: quiet the same day", logic.checkinDue({ ...profile, checkinSkip: skip1 }, week1, [], Date.parse(at(4.5))), false);
      check("skipped: one reminder", logic.checkinDue({ ...profile, checkinSkip: skip1 }, week1, [], Date.parse(at(5.5))), true);
      const skip2 = logic.nextSkip({ ...profile, checkinSkip: skip1 }, week1, [], Date.parse(at(6)));
      check("skipped twice: no nagging", logic.checkinDue({ ...profile, checkinSkip: skip2 }, week1, [], Date.parse(at(30))), false);

      const early = [{ ...week1[0], duration: 420 }, { ...week1[1], duration: 420 }, week1[2]];
      check("confidence 1 repeats", logic.repeatDecision(plan, 1, null, week1), "repeat");
      check("nervous first time advances", logic.repeatDecision(plan, 2, null, week1), "advance");
      check("confident advances", logic.repeatDecision(plan, 3, null, week1), "advance");
      check("confident with one early advances", logic.repeatDecision(plan, 4, null, [early[0]]), "advance");
      check("two early runs prompt", logic.repeatDecision(plan, 3, null, early), "Two runs ended early this week. Repeat the week, or move on?");
      check("low twice offers repeat", logic.repeatDecision(plan, 2, checkinAt(1, 2), week1).includes("Repeat"), true);
      check("summary, same", logic.confidenceSummary(checkinAt(2, 2), checkinAt(1, 2), false), "Same as week 1, and still going");
      check("summary, up", logic.confidenceSummary(checkinAt(2, 2), checkinAt(1, 1), false), "Up from week 1");
      check("summary, repeat", logic.confidenceSummary(checkinAt(2, 1), checkinAt(1, 1), true), "Next week repeats this one. That's the plan working.");
      check("short option", logic.shortOption("Nervous, but I'll try"), "Nervous");
      const badgeCheckin = checkinAt(2, 3);
      check("badge at 5 min", logic.unlockedBadge(plan, [fullRun(1, 4, 1)], [badgeCheckin], badgeCheckin), "5 min run");
      const laterCheckin = checkinAt(3, 3);
      check("no repeat badge", logic.unlockedBadge(plan, [fullRun(1, 4, 1)], [badgeCheckin, laterCheckin], laterCheckin), null);
      check("rolling weight", logic.rollingWeight([90, 87, 84, 81]), [90, 88.5, 87, 84]);
      check("wins sort by count", logic.winCounts([{ wins: ["A", "B"] }, { wins: ["B"] }])[0], { win: "B", count: 2 });
      check("no numeric options", (await (await fetch("../checkinQuestions.json")).json()).every((q) => q.options.length === 4 && q.options.every((o) => !/\d/.test(o))), true);

      lines.unshift(failures ? `${failures} FAILED` : `ALL PASSED (${lines.length})`);
      document.getElementById("output").textContent = lines.join("\n");
      document.title = failures ? "FAILED" : "PASSED";
    </script>
  </body>
</html>
